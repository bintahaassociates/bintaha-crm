<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/bintaha-crm/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#d97706" />
    <meta name="description" content="Bin Taha Associates CRM — Private Executive Watchdog & Real Estate Management Portal" />
    
    <!-- PWA Web App Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BinTaha CRM" />
    
    <!-- Manifest & App Icons -->
    <link rel="manifest" href="/bintaha-crm/manifest.json" />
    <link rel="apple-touch-icon" href="/bintaha-crm/icon-192.png" />
    
    <title>Bin Taha Associates CRM</title>
    
    <!-- Branding Meta -->
    <meta property="og:title" content="Bin Taha Associates CRM" />
    <meta property="og:description" content="Executive CRM & Property Management System" />
    <meta property="og:image" content="/bintaha-crm/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Register Service Worker for Offline & Installable PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/bintaha-crm/sw.js')
            .then((reg) => console.log('Bin Taha CRM PWA Active:', reg.scope))
            .catch((err) => console.error('PWA Worker Registration Failed:', err));
        });
      }
    </script>
  </body>
</html>
